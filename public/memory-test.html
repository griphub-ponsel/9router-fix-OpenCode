<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9Router Memory System Test - Aldrey</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #2d3748;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }
        .test-item {
            margin: 20px 0;
            padding: 15px;
            background: #f8fafc;
            border-left: 4px solid #3182ce;
            border-radius: 4px;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .status.success {
            background: #c6f6d5;
            color: #22543d;
        }
        .status.error {
            background: #fed7d7;
            color: #822727;
        }
        .status.pending {
            background: #feebc8;
            color: #7c2d12;
        }
        pre {
            background: #1a202c;
            color: #cbd5e0;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
            margin: 10px 0;
        }
        button {
            background: #3182ce;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background: #2b6cb0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .card-value {
            font-size: 28px;
            font-weight: bold;
            color: #3182ce;
        }
        .card-label {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 9Router Memory System Test - User: Aldrey</h1>
        
        <div id="tests">
            <!-- Test results will appear here -->
        </div>

        <button onclick="runAllTests()">🔄 Run All Tests</button>
        <button onclick="clearMemory()">🗑️ Clear All Memory</button>
    </div>

    <script>
        const API_BASE = '/api/memory';
        
        async function runAllTests() {
            const tests = [];
            
            // Test 1: Stats API
            tests.push({
                name: "Stats API",
                fn: async () => {
                    try {
                        const res = await fetch(`${API_BASE}/stats`);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const data = await res.json();
                        return `✓ ${data.totalMemories || 0} memories, ${data.totalObservations || 0} observations`;
                    } catch (error) {
                        throw error;
                    }
                }
            });
            
            // Test 2: Search API
            tests.push({
                name: "Search API",
                fn: async () => {
                    try {
                        const res = await fetch(`${API_BASE}/search?limit=5`);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const data = await res.json();
                        return `✓ Found ${data.memories?.length || 0} memories`;
                    } catch (error) {
                        throw error;
                    }
                }
            });
            
            // Test 3: Export API
            tests.push({
                name: "Export API",
                fn: async () => {
                    try {
                        const res = await fetch(`${API_BASE}/export?format=json`);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const blob = await res.blob();
                        const size = (blob.size / 1024).toFixed(2);
                        return `✓ Exported ${size} KB`;
                    } catch (error) {
                        throw error;
                    }
                }
            });
            
            // Render tests
            const container = document.getElementById('tests');
            container.innerHTML = '';
            
            for (const test of tests) {
                const item = document.createElement('div');
                item.className = 'test-item';
                item.innerHTML = `
                    <strong>${test.name}</strong>
                    <span class="status pending">Running...</span>
                    <div id="${test.name.replace(/\s+/g, '-')}-result" style="margin-top:10px;"></div>
                `;
                container.appendChild(item);
                
                // Run test
                try {
                    const result = await test.fn();
                    const resultEl = document.getElementById(`${test.name.replace(/\s+/g, '-')}-result`);
                    resultEl.innerHTML = `<pre>${JSON.stringify(JSON.parse(result), null, 2)}</pre>`;
                    item.querySelector('.status').className = 'status success';
                    item.querySelector('.status').textContent = 'SUCCESS';
                } catch (error) {
                    const resultEl = document.getElementById(`${test.name.replace(/\s+/g, '-')}-result`);
                    resultEl.innerHTML = `<div style="color: #e53e3e;">✗ ${error.message}</div>`;
                    item.querySelector('.status').className = 'status error';
                    item.querySelector('.status').textContent = 'FAILED';
                }
            }
            
            // Add summary cards
            setTimeout(async () => {
                try {
                    const res = await fetch(`${API_BASE}/stats`);
                    const data = await res.json();
                    
                    const summaryDiv = document.createElement('div');
                    summaryDiv.className = 'grid';
                    summaryDiv.innerHTML = `
                        <div class="card">
                            <div class="card-value">${data.totalMemories || 0}</div>
                            <div class="card-label">Total Memories</div>
                        </div>
                        <div class="card">
                            <div class="card-value">${data.totalObservations || 0}</div>
                            <div class="card-label">Observations</div>
                        </div>
                        <div class="card">
                            <div class="card-value">${Object.keys(data.memoriesByType || {}).length}</div>
                            <div class="card-label">Memory Types</div>
                        </div>
                        <div class="card">
                            <div class="card-value">${new Date().toLocaleTimeString()}</div>
                            <div class="card-label">Last Updated</div>
                        </div>
                    `;
                    container.insertBefore(summaryDiv, container.firstChild);
                } catch (e) {
                    console.log("Failed to load summary");
                }
            }, 500);
        }
        
        async function clearMemory() {
            if (!confirm("Are you sure you want to delete ALL memories? This cannot be undone!")) {
                return;
            }
            
            try {
                // Get all memories first
                const searchRes = await fetch(`${API_BASE}/search?limit=1000`);
                const searchData = await searchRes.json();
                
                // Delete each memory
                let deleted = 0;
                for (const memory of searchData.memories || []) {
                    await fetch(`${API_BASE}/${memory.id}`, { method: 'DELETE' });
                    deleted++;
                }
                
                alert(`✅ Cleared ${deleted} memories successfully!`);
                location.reload();
            } catch (error) {
                alert(`❌ Failed to clear memory: ${error.message}`);
            }
        }
        
        // Auto-run on page load
        window.addEventListener('DOMContentLoaded', runAllTests);
    </script>
</body>
</html>
